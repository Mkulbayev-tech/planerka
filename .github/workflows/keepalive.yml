# Бесплатный проект Supabase засыпает после недели без обращений — приложение тогда пишет «Load failed».
# Раз в 3 дня делаем один запрос к базе, чтобы этого не случалось.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Запрос к базе
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL/rest/v1/households?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase ответил: HTTP $code"
          test "$code" = 200
